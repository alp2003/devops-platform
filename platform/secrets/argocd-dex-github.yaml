# ArgoCD's GitHub login (Dex GitHub connector). argocd-cm refers to the keys as
# $argocd-dex-github:clientID / :clientSecret; ArgoCD only resolves such references in
# Secrets labelled app.kubernetes.io/part-of=argocd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-dex-github
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: argocd-dex-github
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientID
      remoteRef:
        key: /devops-platform/argocd-github-client-id
    - secretKey: clientSecret
      remoteRef:
        key: /devops-platform/argocd-github-client-secret
