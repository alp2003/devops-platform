# The only way the cluster reaches AWS secrets. No auth block: ESO uses its Pod
# Identity role (infra/eks/external-secrets.tf), which can read /devops-platform/* only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
  conditions:
    - namespaces: [monitoring] # no other namespace may pull secrets through this store
