# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kyverno.io/clusterpolicy_v1.json
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-readonly-rootfs
  annotations:
    policies.kyverno.io/description: "Containers must use a read-only root filesystem."
spec:
  background: true
  emitWarning: true        # ← new: show Audit violations as kubectl warnings
  rules:
    - name: readonly-rootfs
      match:
        any:
          - resources: { kinds: [Pod] }
      exclude:
        any:
          - resources: { namespaces: [kube-system, kyverno] }
      validate:
        failureAction: Audit
        message: "Set securityContext.readOnlyRootFilesystem: true"
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
