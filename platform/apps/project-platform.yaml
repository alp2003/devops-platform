apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # projects before any app that uses them
spec:
  description: Cluster-level platform tools (platform team only)
  sourceRepos:
    - https://github.com/alp2003/devops-platform.git
    - https://kyverno.github.io/kyverno/
    - https://falcosecurity.github.io/charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://charts.external-secrets.io
  destinations:
    - { server: https://kubernetes.default.svc, namespace: kyverno }
    - { server: https://kubernetes.default.svc, namespace: falco }
    - { server: https://kubernetes.default.svc, namespace: monitoring }
    - { server: https://kubernetes.default.svc, namespace: external-secrets }
    # kube-prometheus-stack creates Services in kube-system to scrape CoreDNS and the kubelet
    - { server: https://kubernetes.default.svc, namespace: kube-system }
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
