apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: web
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # projects before any app that uses them
spec:
  description: Web application (dev + prod)
  sourceRepos:
    - https://github.com/alp2003/devops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: web-dev
    - server: https://kubernetes.default.svc
      namespace: web-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: monitoring.coreos.com   # the app's scrape config, nothing else from that API
      kind: ServiceMonitor
    - group: networking.k8s.io       # the app's own default-deny and allow rules
      kind: NetworkPolicy
