apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.2.2
    helm:
      releaseName: falco
      valuesObject:
        driver:
          kind: modern_ebpf
        tty: true
        falco:
          json_output: true
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Falco needs privileged access to the kernel (eBPF). Documented exception.
        pod-security.kubernetes.io/enforce: privileged
