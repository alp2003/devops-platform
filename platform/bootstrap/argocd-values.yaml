# Minimal ArgoCD for the lab
dex:
  enabled: false        # no SSO yet; we log in as admin via port-forward
notifications:
  enabled: false        # not needed yet; saves memory
configs:
  params:
    application.namespaces: ""   # Applications only in the argocd namespace
  cm:
    # Give Application objects a health status (removed from ArgoCD's defaults in 1.8).
    # Without it, the root app treats a child app as done as soon as it EXISTS, so sync
    # waves only order creation by seconds. With it, wave N+1 starts only when every
    # app in wave N is Healthy. Snippet from the ArgoCD docs (app-of-apps sync waves).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Kyverno's ImageValidatingPolicy has no built-in health in ArgoCD, so it counted as
    # Healthy the moment it EXISTED, before Kyverno had registered its webhook. Healthy now
    # means Kyverno reports it ready, so the web apps (next wave) start only after
    # signature enforcement is really active.
    resource.customizations.health.policies.kyverno.io_ImageValidatingPolicy: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for Kyverno to report the policy ready"
      if obj.status ~= nil and obj.status.conditionStatus ~= nil then
        local cs = obj.status.conditionStatus
        if cs.ready == true then
          hs.status = "Healthy"
          hs.message = "Ready"
        elseif cs.conditions ~= nil then
          for _, c in ipairs(cs.conditions) do
            if c.status == "False" then
              hs.message = (c.type or "condition") .. ": " .. (c.message or "not ready")
            end
          end
        end
      end
      return hs
