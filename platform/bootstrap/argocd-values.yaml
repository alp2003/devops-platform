# Minimal ArgoCD for the lab
dex:
  enabled: true         # GitHub login (connector in configs.cm."dex.config")
notifications:
  enabled: false        # not needed yet; saves memory
configs:
  params:
    application.namespaces: ""   # Applications only in the argocd namespace
  cm:
    # Where people reach ArgoCD (kubectl port-forward). Dex's GitHub callback is
    # <url>/api/dex/callback, and must match the OAuth App's callback URL exactly.
    url: https://localhost:8080
    # Credentials come from the argocd-dex-github Secret (External Secrets → SSM).
    # No 'orgs' filter: any GitHub account can authenticate, but RBAC below gives
    # unknown accounts no permissions at all. With a GitHub org: orgs + teams instead.
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $argocd-dex-github:clientID
            clientSecret: $argocd-dex-github:clientSecret
    # Give Application objects a health status (removed from ArgoCD's defaults in 1.8).
    # Without it, the root app treats a child app as done as soon as it EXISTS, so sync
    # waves only order creation by seconds. With it, wave N+1 starts only when every
    # app in wave N is Healthy. Snippet from the ArgoCD docs (app-of-apps sync waves).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Kyverno's ImageValidatingPolicy has no built-in health in ArgoCD, so it counted as
    # Healthy the moment it EXISTED, before Kyverno had registered its webhook. Healthy now
    # means Kyverno reports it ready, so the web apps (next wave) start only after
    # signature enforcement is really active.
    resource.customizations.health.policies.kyverno.io_ImageValidatingPolicy: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for Kyverno to report the policy ready"
      if obj.status ~= nil and obj.status.conditionStatus ~= nil then
        local cs = obj.status.conditionStatus
        if cs.ready == true then
          hs.status = "Healthy"
          hs.message = "Ready"
        elseif cs.conditions ~= nil then
          for _, c in ipairs(cs.conditions) do
            if c.status == "False" then
              hs.message = (c.type or "condition") .. ": " .. (c.message or "not ready")
            end
          end
        end
      end
      return hs
  # Who may do what in ArgoCD. Subjects are GitHub usernames (Dex's preferred_username
  # claim). Prod is never synced by hand: promotion PRs + auto-sync change it.
  rbac:
    policy.default: ""                    # logged in but not listed → sees nothing
    scopes: "[groups, preferred_username]"
    policy.csv: |
      # App developers: see web-dev and web-prod, sync and read logs in dev only
      p, role:web-developer, applications, get, web/*, allow
      p, role:web-developer, applications, sync, web/web-dev, allow
      p, role:web-developer, logs, get, web/web-dev, allow
      # Support / auditors: read-only on everything (built-in role)
      # g, <github-user>, role:readonly
      # Platform team
      g, alp2003, role:admin
