{{- $img := .Values.image -}}
{{- if not (or $img.tag $img.digest) -}}
{{- fail "image.tag or image.digest must be set" -}}
{{- end -}}
{{- if and $img.digest (not (regexMatch "^sha256:[0-9a-f]{64}$" $img.digest)) -}}
{{- fail (printf "image.digest must look like sha256:<64 hex>, got %q" $img.digest) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/version: {{ $img.tag | default "digest-only" | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/version: {{ $img.tag | default "digest-only" | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # repo:tag@digest -> the runtime pulls by digest; the tag is only for humans
          image: "{{ $img.repository }}{{ with $img.tag }}:{{ . }}{{ end }}{{ with $img.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: APP_ENV
              value: {{ .Values.appEnv | default (trimPrefix "web-" .Release.Namespace) | quote }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
