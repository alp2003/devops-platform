name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "v8.30.1"
  TRIVY_VERSION: "0.76.1"
  TERRAFORM_VERSION: "1.17.1"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" "zricethezav/gitleaks:${GITLEAKS_VERSION}" \
            detect --source /repo --redact --no-color -v

  terraform:
    name: Terraform checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: terraform fmt
        run: |
          docker run --rm -v "$PWD:/src" -w /src "hashicorp/terraform:${TERRAFORM_VERSION}" \
            fmt -check -recursive -diff infra
      - name: terraform validate
        run: |
          for d in infra/*/; do
            [ -f "${d}main.tf" ] || continue
            echo "::group::${d}"
            docker run --rm -v "$PWD:/src" -w "/src/${d}" "hashicorp/terraform:${TERRAFORM_VERSION}" \
              init -backend=false -input=false
            docker run --rm -v "$PWD:/src" -w "/src/${d}" "hashicorp/terraform:${TERRAFORM_VERSION}" \
              validate
            echo "::endgroup::"
          done
      - name: trivy config scan (infra)
        run: |
          docker run --rm -v "$PWD:/src" "aquasec/trivy:${TRIVY_VERSION}" \
            config --misconfig-scanners terraform --exit-code 1 \
            --ignorefile /src/.trivyignore /src/infra

  chart-checks:
    name: Chart lint and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/web
      - run: helm template web charts/web > /dev/null
      - name: render every environment
        run: |
          for env in deploy/envs/*/; do
            echo "rendering ${env}"
            helm template web charts/web -f "${env}values.yaml" > /dev/null
          done
      - name: trivy config scan (chart)
        run: |
          docker run --rm -v "$PWD:/src" "aquasec/trivy:${TRIVY_VERSION}" \
            config --exit-code 1 --ignorefile /src/.trivyignore /src/charts/web
      - name: kyverno policy check (every environment)
        run: |
          for env in deploy/envs/*/; do
            name=$(basename "$env")
            helm template web charts/web -f "${env}values.yaml" > "/tmp/web-${name}.yaml"
            echo "== ${name}"
            docker run --rm -v "$PWD:/src" -v /tmp:/manifests ghcr.io/kyverno/kyverno-cli:v1.19.2 \
              apply /src/platform/policies/ --resource "/manifests/web-${name}.yaml" --audit-warn
          done
      - name: root app path contains only ArgoCD resources
        run: |
          bad=$(grep -rLE '^kind: (Application|AppProject)$' platform/apps/ || true)
          if [ -n "$bad" ]; then
            echo "::error::Only Application/AppProject files belong in platform/apps/:"
            echo "$bad"
            exit 1
          fi

  app:
    name: App build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: unit tests (same Python image as production)
        run: docker build --target test app

      - name: build image
        run: |
          docker build \
            --build-arg APP_VERSION=0.0.0-ci \
            --build-arg APP_COMMIT="${GITHUB_SHA::7}" \
            -t web:ci app

      - name: smoke test (hardened, like the cluster)
        run: |
          docker run -d --name web \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 8080:8080 web:ci
          for _ in $(seq 1 20); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 1; done
          curl -fsS localhost:8080/healthz
          commit=$(curl -fsS localhost:8080/version | jq -r .commit)
          echo "image reports commit: ${commit}"
          test "${commit}" = "${GITHUB_SHA::7}"
          metrics=$(curl -fsS localhost:8080/metrics)
          grep -q 'web_build_info{' <<< "${metrics}"
          start=$(date +%s); docker stop web; took=$(( $(date +%s) - start ))
          echo "graceful stop took ${took}s"
          test "${took}" -lt 5

      - name: container logs (on failure)
        if: failure()
        run: docker logs web || true

      - name: trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "aquasec/trivy:${TRIVY_VERSION}" \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed web:ci
