name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.76.2"
  COSIGN_VERSION: "v3.1.4"
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  release:
    name: Build, scan, push, sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC: assume the AWS release role, and cosign keyless signing
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: version from tag
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: tag must point to a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main: only reviewed code can be released"
            exit 1
          fi

      - name: unit tests (same Python image as production)
        run: docker build --target test app

      - name: build image
        run: |
          docker build \
            --build-arg APP_VERSION="${VERSION}" \
            --build-arg APP_COMMIT="${SHORT_SHA}" \
            -t "${ECR_REPOSITORY}:${VERSION}" \
            -t "${ECR_REPOSITORY}:sha-${SHORT_SHA}" \
            app

      - name: smoke test (hardened)
        run: |
          docker run -d --name web \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 8080:8080 "${ECR_REPOSITORY}:${VERSION}"
          for _ in $(seq 1 20); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 1; done
          reported=$(curl -fsS localhost:8080/version | jq -r .version)
          echo "image reports version: ${reported}"
          test "${reported}" = "${VERSION}"
          docker stop web

      - name: container logs (on failure)
        if: failure()
        run: docker logs web || true

      - name: trivy image scan (before anything is pushed)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "aquasec/trivy:${TRIVY_VERSION}" \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "${ECR_REPOSITORY}:${VERSION}"

      - name: trivy report (unfixed, informational)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "aquasec/trivy:${TRIVY_VERSION}" \
            image --exit-code 0 --severity HIGH,CRITICAL --format table "${ECR_REPOSITORY}:${VERSION}"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: release-${{ github.run_id }}
          aws-region: us-east-1

      - name: push to ECR
        id: push
        run: |
          registry="${ECR_REPOSITORY%%/*}"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "${registry}"
          docker push "${ECR_REPOSITORY}:${VERSION}"
          docker push "${ECR_REPOSITORY}:sha-${SHORT_SHA}"
          # The registry's digest is the truth: never trust a locally computed one
          digest=$(aws ecr describe-images --region us-east-1 \
            --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageTag="${VERSION}" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "pushed ${ECR_REPOSITORY}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: install cosign (pinned, checksum-verified)
        run: |
          cd "${RUNNER_TEMP}"
          curl -fsSLO "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -fsSLO "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum --check
          sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
          cosign version

      - name: sign (keyless, by digest)
        run: cosign sign --yes "${ECR_REPOSITORY}@${DIGEST}"

      - name: verify the signature we just made
        run: |
          cosign verify "${ECR_REPOSITORY}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified for ${GITHUB_REF_NAME}"

      - name: summary
        run: |
          {
            echo "### Released web ${VERSION}"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${ECR_REPOSITORY}:${VERSION}\` |"
            echo "| Also tagged | \`sha-${SHORT_SHA}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Signed by | \`${GITHUB_REPOSITORY}/.github/workflows/release.yaml@${GITHUB_REF}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  bump-dev:
    name: Open dev deploy PR
    needs: release
    runs-on: ubuntu-24.04
    permissions: {} # GITHUB_TOKEN gets nothing: everything below uses the App's short-lived token
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Narrower than the App itself: this repo only, only what this job needs
          repositories: devops-platform
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true # needed to push the branch; the token expires and is revoked after the job

      - name: bump dev to the released version
        env:
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ needs.release.outputs.digest }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Never trust inputs blindly, even our own job outputs
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version: ${VERSION}"; exit 1; }
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest: ${DIGEST}"; exit 1; }

          branch="deploy/dev-${VERSION}"
          git switch -c "${branch}"
          # strenv() reads the values from the environment: no string interpolation into the yq program
          yq -i '.image.tag = strenv(VERSION) | .image.digest = strenv(DIGEST)' deploy/envs/dev/values.yaml
          git diff

          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): web ${VERSION}"
          git push origin "${branch}"

          gh pr create --base main --head "${branch}" \
            --title "deploy(dev): web ${VERSION}" \
            --body-file - <<EOF
          Automated by the release workflow.

          | | |
          |---|---|
          | Version | \`${VERSION}\` |
          | Digest | \`${DIGEST}\` |
          | Release run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |

          Verify the signature before merging:
          \`\`\`
          cosign verify ${ECR_REPOSITORY}@${DIGEST} \\
            --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@refs/tags/v${VERSION} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
