name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.76.1"
  COSIGN_VERSION: "v3.1.4"
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  release:
    name: Build, scan, push, sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC: assume the AWS release role, and cosign keyless signing
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: version from tag
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: tag must point to a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main: only reviewed code can be released"
            exit 1
          fi

      - name: unit tests (same Python image as production)
        run: docker build --target test app

      - name: build image
        run: |
          docker build \
            --build-arg APP_VERSION="${VERSION}" \
            --build-arg APP_COMMIT="${SHORT_SHA}" \
            -t "${ECR_REPOSITORY}:${VERSION}" \
            -t "${ECR_REPOSITORY}:sha-${SHORT_SHA}" \
            app

      - name: smoke test (hardened)
        run: |
          docker run -d --name web \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 8080:8080 "${ECR_REPOSITORY}:${VERSION}"
          for _ in $(seq 1 20); do curl -fsS localhost:8080/healthz >/dev/null && break; sleep 1; done
          reported=$(curl -fsS localhost:8080/version | jq -r .version)
          echo "image reports version: ${reported}"
          test "${reported}" = "${VERSION}"
          docker stop web

      - name: container logs (on failure)
        if: failure()
        run: docker logs web || true

      - name: trivy image scan (before anything is pushed)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "aquasec/trivy:${TRIVY_VERSION}" \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "${ECR_REPOSITORY}:${VERSION}"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: release-${{ github.run_id }}
          aws-region: us-east-1

      - name: push to ECR
        id: push
        run: |
          registry="${ECR_REPOSITORY%%/*}"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "${registry}"
          docker push "${ECR_REPOSITORY}:${VERSION}"
          docker push "${ECR_REPOSITORY}:sha-${SHORT_SHA}"
          # The registry's digest is the truth: never trust a locally computed one
          digest=$(aws ecr describe-images --region us-east-1 \
            --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageTag="${VERSION}" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "pushed ${ECR_REPOSITORY}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: install cosign (pinned, checksum-verified)
        run: |
          cd "${RUNNER_TEMP}"
          curl -fsSLO "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -fsSLO "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum --check
          sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
          cosign version

      - name: sign (keyless, by digest)
        run: cosign sign --yes "${ECR_REPOSITORY}@${DIGEST}"

      - name: verify the signature we just made
        run: |
          cosign verify "${ECR_REPOSITORY}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified for ${GITHUB_REF_NAME}"

      - name: summary
        run: |
          {
            echo "### Released web ${VERSION}"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${ECR_REPOSITORY}:${VERSION}\` |"
            echo "| Also tagged | \`sha-${SHORT_SHA}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Signed by | \`${GITHUB_REPOSITORY}/.github/workflows/release.yaml@${GITHUB_REF}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
